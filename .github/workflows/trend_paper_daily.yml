name: Trend Bot Daily Paper Trading

on:
  schedule:
    # Her gun 22:00 UTC (US market close sonrasi + crypto for the day)
    # 3 ay boyunca: 2026-06-10 baslangic, 2026-09-10 son
    - cron: '0 22 * * *'
  workflow_dispatch:   # manuel tetikleme

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout bist-sentiment-bot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance lightgbm pyyaml loguru pyarrow

      - name: Run daily paper trading
        run: python scripts/trend_run_daily.py

      - name: Commit + push paper book state
        run: |
          git config user.name "trend-bot[github-actions]"
          git config user.email "actions@github.com"
          git add data/processed/trend_paper/ || true
          git diff --staged --quiet || git commit -m "trend-bot: daily paper trading update $(date -u +%Y-%m-%d)"
          git push

      - name: Checkout portfolio-tracker
        uses: actions/checkout@v4
        with:
          repository: Cugutayy/portfolio-tracker
          path: portfolio-tracker
          token: ${{ secrets.PORTFOLIO_TRACKER_PAT }}

      - name: Sync site data
        run: |
          mkdir -p portfolio-tracker/tracker/trend-bot/data
          cp -f data/processed/trend_paper/*.json portfolio-tracker/tracker/trend-bot/data/ || true

      - name: Commit + push to portfolio-tracker
        working-directory: portfolio-tracker
        run: |
          git config user.name "trend-bot[github-actions]"
          git config user.email "actions@github.com"
          git add tracker/trend-bot/data/ || true
          git diff --staged --quiet || git commit -m "trend-bot: site data sync $(date -u +%Y-%m-%d)"
          git push
