name: Daily Paper Trade

# Her iş günü BIST kapanışından sonra çalışır.
# BIST kapanış: 18:00 TSI (15:00 UTC). Yahoo'da veri tam yansıması için +1h.
# Cron UTC: 16:00 Pzt-Cum (= 19:00 TSI)
on:
  schedule:
    - cron: '0 16 * * 1-5'   # weekdays 16:00 UTC
  workflow_dispatch:           # elle de tetiklenebilir

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout bist-sentiment-bot
        uses: actions/checkout@v4
        with:
          path: bist-sentiment-bot

      - name: Checkout portfolio-tracker
        uses: actions/checkout@v4
        with:
          repository: Cugutayy/portfolio-tracker
          token: ${{ secrets.PORTFOLIO_TRACKER_PAT }}
          path: portfolio-tracker

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bist-sentiment-bot/requirements.txt

      - name: Install dependencies
        working-directory: bist-sentiment-bot
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest fresh price + news data
        working-directory: bist-sentiment-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py ingest || echo "ingest had warnings, continuing"

      - name: Score news with Claude
        working-directory: bist-sentiment-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python main.py score || echo "no news today"
          python main.py aggregate || true

      - name: Run predict + paper book update
        working-directory: bist-sentiment-bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py predict

      - name: Export JSON to portfolio-tracker
        working-directory: bist-sentiment-bot
        env:
          PORTFOLIO_TRACKER_PATH: ${{ github.workspace }}/portfolio-tracker
        run: python scripts/export_for_web.py

      - name: Commit & push portfolio-tracker
        working-directory: portfolio-tracker
        run: |
          git config user.name  "sentiment-bot[bot]"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add tracker/sentiment-bot/data/*.json
          if git diff --staged --quiet; then
            echo "No JSON changes, skipping commit."
          else
            git commit -m "data: daily paper trade update ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Commit bot data artifacts
        working-directory: bist-sentiment-bot
        run: |
          git config user.name  "sentiment-bot[bot]"
          git config user.email "sentiment-bot@users.noreply.github.com"
          git add data/processed/paper_book.parquet data/processed/paper_trades.parquet data/processed/shortlist_*.parquet 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No bot artifact changes."
          else
            git commit -m "data: paper book state ($(date -u +%Y-%m-%d))"
            git push
          fi
