# BIST Sentiment Bot — Configuration
# Tüm "magic numbers" buraya. Kod içinde hardcoded değer YASAK.

universe:
  # BIST 30 — odaklı evren. BIST 50 denendi ama mid-cap'lerde news kapsamı
  # zayıf olduğu için sentiment NaN dominansı oluştu, Sharpe +0.40 → -0.37
  # düştü. Mid-cap noise > sinyal. Rollback yapıldı.
  # Trade frekansını artırmak için universe yerine rebalance + top_n'i tune.
  tickers:
    - THYAO.IS
    - ASELS.IS
    - GARAN.IS
    - AKBNK.IS
    - YKBNK.IS
    - ISCTR.IS
    - HALKB.IS
    - VAKBN.IS
    - KCHOL.IS
    - SAHOL.IS
    - TUPRS.IS
    - SISE.IS
    - EREGL.IS
    - BIMAS.IS
    - FROTO.IS
    - TOASO.IS
    - TCELL.IS
    - TAVHL.IS
    - PGSUS.IS
    - EKGYO.IS
    - PETKM.IS
    - TTKOM.IS
    - ARCLK.IS
    - ENKAI.IS
    - TKFEN.IS
    - SASA.IS
    - GUBRF.IS
    - DOHOL.IS
    - MGROS.IS
    - SOKM.IS

  benchmark: XU100.IS    # Excess return için referans

# Veri ingestion
ingestion:
  price_history_days: 1825    # 5 yıl geriye
  # Türkçe finans/ekonomi RSS feed'leri — hepsi probe ile doğrulandı (HTTP 200).
  # KAP açıklamaları (bedelsiz, temettü, kar, ihale vb.) bu kaynaklarda
  # anında haber olarak çıkıyor — KAP'ı doğrudan scrape etmeye gerek yok.
  news_feeds:
    - name: BloombergHT
      url: https://www.bloomberght.com/rss
    - name: Dünya
      url: https://www.dunya.com/rss?dunyarss=anasayfa
    - name: AA Ekonomi
      url: https://www.aa.com.tr/tr/rss/default?cat=ekonomi
    - name: Hürriyet Ekonomi
      url: https://www.hurriyet.com.tr/rss/ekonomi
    - name: Sabah Ekonomi
      url: https://www.sabah.com.tr/rss/ekonomi.xml
    - name: Habertürk Ekonomi
      url: https://www.haberturk.com/rss/kategori/ekonomi.xml
    - name: Yeni Şafak Ekonomi
      url: https://www.yenisafak.com/rss?xml=ekonomi
    # NOT: feed dropoff'a karşı news_collector her feed için ayrı try/except.
    # 6 ay'da bir feed listesi bakım: scripts/probe_feeds.py

# NLP / Sentiment
nlp:
  claude_model: claude-haiku-4-5     # ucuz + hızlı + Türkçe iyi
  max_input_tokens: 4096
  cache_dir: data/cache/sentiment    # content-hash cache
  batch_size: 20                     # tek istekte kaç haber

  # Sentiment aggregation (literatür: Kirtaç 2024, MANA-Net 2024, arXiv 2505.16136)
  # Tek-haber dominasyonu önleme: winsorize + decay + confidence × credibility
  aggregation:
    decay_half_life_days: 5          # half-life, exponential decay (recency)
    winsorize_pct: 0.05              # ±2σ ~ %95 quantile clip
    surprise_window_days: 30         # rolling mean for surprise feature
    min_news_for_signal: 1           # alt eşik (yetersiz veri → 0)
    # Kaynak kredibilite ağırlığı (0..1) — KAP > resmi gazete > popüler > genel
    source_credibility:
      "KAP":                 1.00    # gelecekte eklenecek
      "BloombergHT":         0.90
      "Reuters TR":          0.90
      "AA Ekonomi":          0.85
      "Dünya":               0.85
      "Hürriyet Ekonomi":    0.75
      "Sabah Ekonomi":       0.70
      "Habertürk Ekonomi":   0.75
      "Yeni Şafak Ekonomi":  0.65
      "_default":            0.60    # bilinmeyen kaynak

# Feature engineering — hepsi t-1 lagged
features:
  return_windows: [5, 10, 20]
  vol_window: 20
  momentum_window: 60
  sentiment_windows: [3, 7, 14]      # gün
  rsi_window: 14

# Labeling
labels:
  # Label type:
  #   triple_barrier — TP/SL/time barrier (López de Prado, mutlak getiri tahmini)
  #   relative_outperform — cross-section median'i geçer mi? (XU100-relative alpha)
  label_type: relative_outperform
  relative_horizon_days: 5            # forward 5-gün getirisi median'in üstünde mi
  # Triple barrier parametreleri (sadece label_type=triple_barrier ise kullanılır)
  profit_target_pct: 0.025           # +%2.5
  stop_loss_pct: 0.015               # -%1.5
  max_holding_days: 10

# Model
model:
  type: lightgbm
  params:
    n_estimators: 400                # tuned best (200, 800 denendi - 400 optimal)
    learning_rate: 0.03              # tuned best (0.01, 0.05 denendi - 0.03 optimal)
    max_depth: 6                     # tuned best (4, 8 denendi - 6 optimal)
    num_leaves: 31                   # depth=6 ile uyumlu
    min_child_samples: 20
    random_state: 42
  retrain_frequency_days: 7
  walk_forward:
    train_window_days: 252           # ~1 yıl optimal (504 denendi, overfit oldu)
    test_window_days: 21             # ~1 ay
    purge_days: 5                    # train→test arası purge (label overlap)
    embargo_days: 5                  # data leak savunması (autocorrelation)
    # continuous=True: anchored walk-forward, ardışık test pencereleri.
    # Strateji yıl boyunca aktif kalır (live deployment simülasyonu).
    # continuous=False: klasik gap'li (her fold kendi train'inden başlar).
    # Live amacı için True; pure out-of-sample sertligi için False.
    continuous: true

# BIST cost modeli (yıllık güncelle)
# NOT: close-to-close execution varsayımı. Live'da next-day open alımı
# yapılacaksa, overnight gap riski slippage'ı artırır. BIST'te ortalama
# overnight gap |%0.3-0.5|, news günlerinde |%1-2|. Conservative slippage
# bunu kısmen kapsar.
costs:
  commission_pct: 0.0005             # %0.05 broker (ortalama)
  bsmv_pct: 0.05                     # komisyon üzerinden %5 BSMV
  spread_bps: 15                     # bp tahmini (likit BIST 30: 5-10, küçük cap: 25+)
  slippage_bps: 15                   # market impact + overnight gap proxy (artırıldı: 5→15)
                                     # TODO: Faz 5 — OHLC ile gerçek open-execution simülasyonu

# Strateji
strategy:
  top_n: 3                           # en iyi (relative label ile)
  signal_invert: false               # IC analysis ile test edildi: inverted hala kötü (-0.13 Sharpe).
                                     # Model'in gerçek IC'si ~0 olduğu için yön önemli değil,
                                     # asıl sorun sinyal kalitesinde.
  max_position_pct: 0.34             # top 3 ile uyumlu
  min_liquidity_tl: 50000000         # günlük >50M TL hacim (Faz 3'te uygulanacak)
  sector_max_pct: 0.30               # sektör başına max %30 (Faz 3'te)
  # Turnover azaltma — denedi: 3-day rebalance Sharpe'ı çöktürdü (-0.01).
  # 5-day haftalık rebalance optimal (Sharpe +0.40).
  rebalance_freq_days: 10            # turnover azaltma kritik (cost erosion)
  signal_smooth_window: 5            # best tested

# Risk yönetimi (sinyal seviyesinde)
risk:
  max_drawdown_pct: 0.15             # toplam DD aşılırsa exposure %50'e düş
  target_annual_vol_pct: 0.20

# Loglama
logging:
  level: INFO
  file: logs/bist_bot.log
  rotation: "1 day"
  retention: "30 days"
